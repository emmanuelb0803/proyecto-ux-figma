<main class="register-page"><div class="section-hero register-hero"><div class="section-hero-content"><img src="img/map-pinned.png" alt="" /><div><h2>Punto de Información y Registro</h2><p>Cuéntanos qué necesitas, estamos para ayudarte</p></div></div></div><div class="register-layout"><aside><img src="img/cali landmark photo.png" alt="Cali, Valle del Cauca" /><em>Cali te espera</em><span>♧ +</span></aside><form id="regionalForm" novalidate><h2>¿Qué estás buscando en tu próximo viaje?</h2><label>Nombre completo<input name="nombre" placeholder="Ej: Juan Pérez García" required /></label><label>Correo electrónico<input type="email" name="email" placeholder="Ej: ejemplo@correo.com" required /></label><label>Tipo de visitante<select name="tipoVisitante" required><option value="">Selecciona una opción</option><option>Turista</option><option>Estudiante</option><option>Empresario</option><option>Familia</option></select></label><label>Tipo de servicio de interés<select name="tipoServicio" required><option value="">Selecciona una opción</option><option>Hospedaje</option><option>Gastronomía</option><option>Transporte</option><option>Tour</option><option>Cultura</option></select></label><label>Mensaje o Comentario<textarea name="mensaje" rows="3" placeholder="Escribe aquí tu mensaje..."></textarea></label><p class="required-note">Este campo es obligatorio</p><button class="submit-button" type="submit">Enviar</button><div class="form-status" id="formStatus" aria-live="polite"></div></form></div></main><script src="script.js"></script></body>
