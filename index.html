<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mi pasaporte turístico del Valle del Cauca." />
    <title>Mi Pasaporte Turístico | Valle del Cauca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <div class="brand" aria-label="Mi Pasaporte Turístico">
          <div class="brand-mark-wrap">
            <img src="img/logo.png" alt="Mi Pasaporte Turístico" />
          </div>
          <div class="brand-text">
            <strong>Mi Pasaporte Turístico</strong>
            <small>Call-Valle del Cauca</small>
          </div>
        </div>

        <nav class="main-nav" aria-label="Navegación principal">
          <a href="#inicio">Inicio</a>
          <a href="#destino">Destino</a>
          <a href="#datasets">Datasets</a>
          <a href="#registro">Registro</a>
          <a href="#nosotros">Nosotros</a>
        </nav>

        <button class="profile-button" aria-label="Abrir perfil">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="10" r="6.5" /><path d="M3.5 29c1-7 5.2-10.5 12.5-10.5S27.5 22 28.5 29" /></svg>
        </button>
      </header>

      <section class="hero-section" id="inicio" aria-label="Punto de información y registro">
        <div class="hero-bg" role="img" aria-label="Paisaje del Valle del Cauca"></div>
        <div class="hero-overlay"></div>

        <div class="hero-content">
          <div class="hero-pin" aria-hidden="true">
            <img src="img/map-pinned.png" alt="" />
          </div>

          <div class="hero-copy">
            <h1>Punto de Información y Registro</h1>
            <p>Cuéntanos qué necesitas estamos para ayudarte</p>
          </div>
        </div>
      </section>

      <section class="main-panel" aria-label="Formulario de registro">
        <form class="form-card" id="regionalForm" novalidate>
          <h2>¿Qué estás buscando en tu próximo viaje?</h2>

          <label class="field">
            <span>Nombre completo</span>
            <input type="text" name="nombre" placeholder="Ej: Juan Pérez García" required />
          </label>

          <label class="field">
            <span>Correo electrónico</span>
            <input type="email" name="email" placeholder="Ej: ejemplo@correo.com" required />
          </label>

          <label class="field">
            <span>Tipo de visitante</span>
            <select name="tipoVisitante" required>
              <option value="">Selecciona una opción</option>
              <option value="Turista">Turista</option>
              <option value="Estudiante">Estudiante</option>
              <option value="Empresario">Empresario</option>
              <option value="Familia">Familia</option>
            </select>
          </label>

          <label class="field">
            <span>Tipo de servicio de interés</span>
            <select name="tipoServicio" required>
              <option value="">Selecciona una opción</option>
              <option value="Hospedaje">Hospedaje</option>
              <option value="Gastronomía">Gastronomía</option>
              <option value="Transporte">Transporte</option>
              <option value="Tour">Tour</option>
              <option value="Cultura">Cultura</option>
            </select>
          </label>

          <label class="field field-message">
            <span>Mensaje o Comentario</span>
            <textarea name="mensaje" rows="4" placeholder="Escribe aquí tu mensaje..."></textarea>
          </label>

          <div class="required-note" aria-live="polite">Este campo es obligatorio</div>

          <button type="submit" class="submit-button">Enviar</button>

          <div class="form-status" id="formStatus" aria-live="polite"></div>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
